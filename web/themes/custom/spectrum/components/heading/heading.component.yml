$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Heading
description: 'A single heading (H1–H4). Drop it into a Content Section and drag it above or below other elements.'
group: 'Spectrum - Elements'
status: stable
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: 'Heading text'
      examples:
        - 'Who we are'
    level:
      type: string
      title: 'Heading level'
      description: 'Use H1 only when the page has no Hero or Page Banner.'
      enum:
        - h1
        - h2
        - h3
        - h4
      meta:enum:
        h1: 'H1 (page title)'
        h2: 'H2 (section title)'
        h3: 'H3 (sub heading)'
        h4: 'H4 (small heading)'
      default: h2
      examples:
        - h2
    space_above:
      type: string
      title: 'Space above'
      description: 'Extra space above, added to the normal gap.'
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: 'None'
        small: 'Small (8px)'
        medium: 'Medium (24px)'
        large: 'Large (60px)'
      default: none
      examples:
        - none
    space_below:
      type: string
      title: 'Space below'
      description: 'Extra space below, added to the normal gap.'
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: 'None'
        small: 'Small (8px)'
        medium: 'Medium (24px)'
        large: 'Large (60px)'
      default: none
      examples:
        - none
    
    color:
      type: string
      title: Colour
      description: 'Pick a Brand Kit colour. Leave empty for the default dark colour.'
      $ref: json-schema-definitions://canvas.module/color
      x-canvas-color-picker: kit-only
