$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Site Footer
description: 'Light grey footer with logo, social links, a Footer menu slot for Footer Columns, copyright text and a Legal links slot for Footer Links. Place it once in the Canvas page template.'
group: 'Spectrum - Header & Footer'
status: stable
props:
  type: object
  required:
    - logo
  properties:
    logo:
      $ref: json-schema-definitions://canvas.module/image
      title: Logo
      examples:
        - src: /themes/custom/spectrum/logo.svg
          alt: 'SpectraTech home'
          width: 179
          height: 40
    copyright:
      type: string
      title: 'Copyright text'
      examples:
        - '©2026 SpectraTech. All rights reserved.'
    x_url:
      type: string
      format: uri-reference
      title: 'X (Twitter) URL'
      examples:
        - https://x.com
    linkedin_url:
      type: string
      format: uri-reference
      title: 'LinkedIn URL'
      examples:
        - https://www.linkedin.com
    youtube_url:
      type: string
      format: uri-reference
      title: 'YouTube URL'
      examples:
        - https://www.youtube.com
slots:
  menu:
    title: 'Footer menu'
    description: 'Add Footer Column components here.'
  legal:
    title: 'Legal links'
    description: 'Add Footer Link components here.'
