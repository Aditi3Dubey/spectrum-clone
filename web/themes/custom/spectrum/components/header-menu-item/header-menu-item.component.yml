$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Header Menu Item
description: 'Top-level item in the header menu. Leave the Columns slot empty for a plain link, or add Header Menu Columns to get a mega dropdown.'
group: 'Spectrum - Header & Footer'
status: stable
props:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      title: 'Menu title'
      examples:
        - Products
    url:
      type: string
      format: uri-reference
      title: 'Link'
      examples:
        - /products
    explore_text:
      type: string
      title: 'Explore link text'
      description: 'Shown at the top of the dropdown, e.g. "Explore all products". Optional.'
      examples:
        - 'Explore all products'
slots:
  columns:
    title: 'Dropdown columns'
    description: 'Add Header Menu Column components here. Leave empty for a plain link.'
libraryOverrides:
  dependencies:
    - core/components.spectrum--main-menu
