$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Rich Text
description: 'Formatted text: paragraphs, lists, bold and links. Drop it into a Content Section and drag it above or below other elements.'
group: 'Spectrum - Elements'
status: stable
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>We design and build wire processing systems used by manufacturers around the world.</p>'
    space_above:
      type: string
      title: 'Space above'
      description: 'Extra space above, added to the normal gap.'
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: 'None'
        small: 'Small (8px)'
        medium: 'Medium (24px)'
        large: 'Large (60px)'
      default: none
      examples:
        - none
    space_below:
      type: string
      title: 'Space below'
      description: 'Extra space below, added to the normal gap.'
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: 'None'
        small: 'Small (8px)'
        medium: 'Medium (24px)'
        large: 'Large (60px)'
      default: none
      examples:
        - none
    color:
      type: string
      title: 'Text Colour'
      description: 'Pick any colour. Leave empty for the default dark colour.'
      $ref: json-schema-definitions://canvas.module/color
      x-canvas-color-picker: kit-and-free
