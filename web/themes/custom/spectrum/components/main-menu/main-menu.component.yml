$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Main Menu
description: 'Shared CSS and JS for the mega dropdown menu (desktop full-width panel, mobile accordion). Header Menu Item loads this library. Hidden from Canvas: editors build the menu with Header Menu Item, Header Menu Column and Header Menu Link.'
group: 'Spectrum - Global'
status: stable
noUi: true
props:
  type: object
  properties:
    links:
      type: array
      title: Links
      description: 'List of items: {title, url, description, active, below[]}. Level 2 = column headings, level 3 = links.'
      items:
        type: object
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
