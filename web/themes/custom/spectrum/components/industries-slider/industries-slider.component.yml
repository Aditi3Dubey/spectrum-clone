$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Industries Slider
description: 'Section heading and subheading above a full-width slider. Each slide is an Industry Card placed in the Slides slot. Has square dot navigation, a pause/play button, swipe on touch screens and optional autoplay.'
group: 'Spectrum - Sections'
status: stable
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      examples:
        - Industries
    subheading:
      type: string
      title: Subheading
      examples:
        - 'Where Our Systems Work'
    autoplay:
      type: boolean
      title: Autoplay
      description: 'Move to the next slide every 5 seconds. Visitors can pause it, and it never runs for visitors who prefer reduced motion.'
      examples:
        - true
slots:
  slides:
    title: Slides
    description: 'Place Industry Card components here. Each card becomes one slide.'
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
