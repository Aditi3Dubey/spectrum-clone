$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Site Header
description: 'Sticky site header with logo, a Navigation slot for Header Menu Items, search panel, contact icon and mobile hamburger. Place it once in the Canvas page template.'
group: 'Spectrum - Header & Footer'
status: stable
props:
  type: object
  required:
    - logo
  properties:
    logo:
      $ref: json-schema-definitions://canvas.module/image
      title: Logo
      examples:
        - src: /themes/custom/spectrum/logo.svg
          alt: 'SpectraTech home'
          width: 179
          height: 40
    home_url:
      type: string
      format: uri-reference
      title: 'Home link'
      examples:
        - /
    contact_url:
      type: string
      format: uri-reference
      title: 'Contact link'
      description: 'Mail icon link. Leave empty to hide the icon.'
      examples:
        - /contact
    search_url:
      type: string
      format: uri-reference
      title: 'Search page URL'
      examples:
        - /search/node
slots:
  navigation:
    title: Navigation
    description: 'Add Header Menu Item components here.'
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - core/components.spectrum--main-menu
